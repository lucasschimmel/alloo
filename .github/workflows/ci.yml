name: Verify Alloo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:mutation
      - run: bun audit
      - run: bunx playwright install --with-deps chromium
      - name: Start isolated local backend
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          bunx convex dev --typecheck disable --tail-logs disable > /tmp/alloo-convex.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/version >/dev/null && test -f .env.local; then break; fi
            sleep 2
          done
          bun scripts/setup-local-auth.ts
          bunx convex env set ALLOO_DEV_DIRECT_CALLS true
      - name: Browser contracts
        env:
          E2E_CONNECTED: '1'
          E2E_MEDIA: '1'
        run: |
          bun run dev > /tmp/alloo-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done
          bun run test:e2e
