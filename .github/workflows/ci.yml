name: Verify Alloo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ORIGIN: http://127.0.0.1:4173
      VITE_LANDING_ORIGIN: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:mutation
      - run: bun audit
      - run: bunx playwright install --with-deps chromium
      - name: Start isolated local backend
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          bunx convex dev --typecheck disable --tail-logs disable > /tmp/alloo-convex.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/version >/dev/null && test -f .env.local; then break; fi
            sleep 2
          done
          bun scripts/setup-local-auth.ts
          bunx convex env set ALLOO_DEV_DIRECT_CALLS true
      - name: Browser contracts
        env:
          E2E_CONNECTED: '1'
          E2E_MEDIA: '1'
          E2E_BASE_URL: 'http://127.0.0.1:4173'
          E2E_LANDING_URL: 'http://127.0.0.1:4174'
        run: |
          bun run build
          bun run --sequential --filter "@alloo/web" --filter "@alloo/landing" deploy:dry-run
          bun run preview --port 4173 > /tmp/alloo-vite.log 2>&1 &
          bun run preview:landing --port 4174 > /tmp/alloo-landing.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null && curl -fsS http://127.0.0.1:4174/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/healthz >/dev/null
          curl -fsS http://127.0.0.1:4174/healthz >/dev/null
          bun run test:e2e
