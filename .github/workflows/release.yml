name: Release readiness
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOO_PUBLIC_ORIGIN: ${{ vars.ALLOO_PUBLIC_ORIGIN }}
      VITE_APP_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
      VITE_LANDING_ORIGIN: ${{ vars.VITE_LANDING_ORIGIN }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bun run deploy:dry-run
